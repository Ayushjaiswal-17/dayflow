name: Keep Backend Awake

on:
  schedule:
    # Off-peak minutes every 10 minutes to reduce GitHub Actions queue delay
    # and stay inside Render's 15-minute free-tier spin-down window.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Ping backend /health endpoint
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::notice::Set GitHub Actions repository variable BACKEND_URL (e.g. https://your-service.onrender.com) to enable keep-alive pings."
            exit 0
          fi

          BASE_URL="${BACKEND_URL%/}"
          case "$BASE_URL" in
            */health) HEALTH_URL="$BASE_URL" ;;
            *)        HEALTH_URL="$BASE_URL/health" ;;
          esac

          echo "Pinging $HEALTH_URL"
          curl --fail --silent --show-error --max-time 70 --retry 2 --retry-delay 5 "$HEALTH_URL"
          echo ""
