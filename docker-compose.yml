name: dayflow

services:
  db:
    image: postgres:17-alpine
    container_name: dayflow-db
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
      POSTGRES_DB: dayflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema + demo seed run automatically on first init (empty volume only).
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow"]
      interval: 5s
      timeout: 4s
      retries: 12

  api:
    build: ./api
    container_name: dayflow-api
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_URL: postgres://dayflow:dayflow@db:5432/dayflow?sslmode=disable
      JWT_SECRET: ${DAYFLOW_JWT_SECRET:-super-secret-dayflow-jwt-token-key-change-in-production-2026}
      JWT_EXPIRY_HOURS: "72"
      DEFAULT_COMPANY_CODE: OI
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173,http://127.0.0.1:8081
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: dayflow-web
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  pgdata:
